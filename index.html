<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Family">
<title>My Family</title>
<style>
:root{--bg:#fff;--panel:#fff;--card:#fff;--text:#17202a;--muted:#5b6773;--line:#e3e7eb;--gray:#f1f3f5;--danger:#b3261e;--ondanger:#fff;--accent:#1f6ac0;--on:#fff;--soft:#eaf3fc;--shadow:0 8px 28px rgba(0,0,0,.16);--ease:cubic-bezier(.2,.8,.2,1)}
html.dark{--bg:#000;--panel:#000;--card:#101214;--text:#f2f4f6;--muted:#a9b2ba;--line:#262a2f;--gray:#17191c;--danger:#ff8a80;--ondanger:#000;--shadow:0 8px 28px rgba(0,0,0,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.4 Arial,Helvetica,sans-serif}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:fixed;left:0;right:0;top:var(--vt,0px);max-width:520px;height:100vh;height:var(--vh,100dvh);margin:0 auto;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
html.kb .tabs,html.kb header{display:none}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex:none}
h1{font-size:22px;margin:0;font-weight:800}h2{font-size:22px;margin:6px 0 12px}h3{margin:0 0 10px;font-size:18px}
.hbtns{display:flex;gap:4px}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:12px;padding:11px 16px;min-height:44px;background:var(--accent);color:var(--on);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),background-color .15s,opacity .15s}
button:active{transform:scale(.95)}
button.secondary{background:var(--gray);color:var(--text)}button.ghost{background:transparent;color:var(--text)}
button.danger{color:var(--danger)}button.block{width:100%}.grow{flex:1;min-width:0}
button.link{background:transparent;color:var(--accent);padding:6px 8px;min-height:44px}
.icon-btn{background:transparent;color:var(--text);width:44px;padding:0;position:relative}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;min-height:0}
main.chatmode{display:flex;flex-direction:column;overflow:hidden;padding:8px 16px 12px}
main.enter{animation:fadeUp .22s var(--ease)}main.enter[data-dir=right]{animation-name:inRight}main.enter[data-dir=left]{animation-name:inLeft}
.tabs{display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);flex:none}
.tabs button{flex:1;flex-direction:column;gap:2px;background:transparent;color:var(--muted);padding:6px 4px;font-size:12px;min-height:54px}
.tabs button.active{background:var(--soft);color:var(--accent)}
.tabs button.active svg{animation:tabPop .35s var(--ease)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:8px}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--gray);color:var(--text);margin:6px 0 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
::placeholder{color:var(--muted);opacity:1}
input[type=range]{padding:0;background:transparent;border:0;accent-color:var(--accent);margin:8px 0}
label{font-size:13px;font-weight:700;display:block}
.empty{text-align:center;padding:48px 18px;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:800;flex:none}
.item{width:100%;background:transparent;color:var(--text);border-radius:0;font-weight:400;justify-content:flex-start;text-align:left;padding:12px 0;gap:12px;border-bottom:1px solid var(--line);min-height:64px}
.item:last-of-type{border-bottom:0}.item .grow{min-width:0}
.hidden,[hidden]{display:none!important}
.notice{padding:10px 12px;border-radius:12px;background:var(--gray);font-size:13px;color:var(--muted);line-height:1.4}
.notice.warn{border:1px solid var(--accent);color:var(--text);margin:0 0 12px}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700}
/* chat */
.chatview{flex:1;min-height:0;display:flex;flex-direction:column}
.chathead{display:flex;align-items:center;gap:6px;padding-bottom:6px}
.chathead .who{flex:1;background:transparent;color:var(--text);justify-content:flex-start;text-align:left;padding:4px;gap:10px;font-weight:400}
.chatarea{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:8px 0;gap:6px}
.message{max-width:85%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--gray);overflow-wrap:anywhere;position:relative;align-self:flex-start;cursor:pointer}
.message.mine{background:var(--soft);border-radius:16px 16px 4px 16px;align-self:flex-end}
.message.has-react{margin-bottom:14px}.msgmeta{margin-top:2px}
.react-chip{position:absolute;bottom:-14px;right:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:14px;line-height:20px}
.react-new .react-chip{animation:pop .35s var(--ease)}
.pop-mine{animation:popMine .26s var(--ease)}.pop-theirs{animation:popTheirs .26s var(--ease)}
.typing-me{padding:8px 12px;pointer-events:none}.typing-me .typing span{background:var(--accent)}.leaving{animation:fadeOut .18s forwards}
#sendBtn.ready{animation:ready .45s var(--ease)}
.dots::after{content:'';animation:dots 1.2s steps(1) infinite}
.typing{display:flex;align-items:center;gap:4px;height:14px;padding:0 1px}.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.16s}.typing span:nth-child(3){animation-delay:.32s}
.message.typing-row,.message.typing-me{padding:7px 11px}
.composer{margin-top:8px}.composer input{margin:0}.composer button.bump{animation:bump .3s var(--ease)}
.reactbar{position:fixed;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;box-shadow:var(--shadow);animation:pop .22s var(--ease)}
.reactbar .rb{background:transparent;min-height:44px;width:44px;padding:0;font-size:22px;border-radius:50%}.reactbar .rb.on{background:var(--soft)}
/* overlays */
#layer{position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100dvh);pointer-events:none;z-index:50}#layer>*{pointer-events:auto}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s}
.overlay.closing{animation:fadeOut .18s forwards}.overlay.center{align-items:center}
.sheet{width:100%;max-width:520px;background:var(--card);color:var(--text);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;overflow:auto;animation:sheetUp .26s var(--ease)}
.overlay.closing .sheet{animation:sheetDown .18s forwards}
.sheet.dialog{border-radius:20px;max-width:340px;margin:16px;animation:pop .24s var(--ease)}.overlay.closing .sheet.dialog{animation:fadeOut .18s forwards}
.menu-ov{position:absolute;inset:0}
.menu{position:fixed;min-width:220px;max-width:min(320px,calc(100vw - 16px));background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;animation:menuIn .18s var(--ease);transform-origin:top right}
.menu-item{width:100%;background:transparent;color:var(--text);justify-content:flex-start;font-weight:600;border-radius:10px;text-align:left}
.menu-item.danger{color:var(--danger)}.menu-note{padding:10px 12px;font-size:13px;color:var(--text);border-bottom:1px solid var(--line)}.menu-note:last-child{border:0}.menu-note small{display:block;color:var(--muted)}
.cropwrap{display:flex;justify-content:center;margin-bottom:8px}.cropwrap canvas{border-radius:12px;touch-action:none;cursor:grab;background:var(--gray)}
.rng{display:block;margin-bottom:6px}
/* toast + bell */
#toasts{position:fixed;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none;z-index:100}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;max-width:420px;box-shadow:var(--shadow);animation:toastIn .3s var(--ease)}
.toast.out{animation:fadeOut .22s forwards}.toast.err{background:var(--danger);color:var(--ondanger)}.toast.ok{background:var(--accent);color:var(--on)}
.badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:var(--ondanger);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.badge.pulse{animation:badgePulse .5s var(--ease)}.icon-btn.ring svg{animation:ring .7s}.icon-btn.spin svg{animation:spinIn .4s var(--ease)}
.shake{animation:shake .35s}
/* profile */
.pv{background:var(--pbg,var(--panel));border:1px solid var(--line);border-radius:20px;overflow:hidden;padding-bottom:14px;margin-bottom:12px}
.bg-normal{--pbg:var(--panel)}.bg-gris{--pbg:var(--gray)}.bg-acento{--pbg:var(--soft)}
.bg-crema{--pbg:#fbf3e0}.bg-menta{--pbg:#e3f4ec}.bg-cielo{--pbg:#e4f0fb}
html.dark .bg-crema{--pbg:#1c1a14}html.dark .bg-menta{--pbg:#0f1f18}html.dark .bg-cielo{--pbg:#0d1822}
.cover{height:150px;background:var(--accent);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.avatarwrap{margin:-48px 16px 0;position:relative;width:96px}
.pavatar{width:96px;height:96px;border:4px solid var(--pbg,var(--panel));background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:36px;font-weight:800;overflow:hidden}
.pavatar img{width:100%;height:100%;object-fit:cover;display:block}
.shape-circle{border-radius:50%}.shape-rounded{border-radius:28%}.shape-square{border-radius:8px}
.pbody{padding:8px 16px 0}.pname{font-size:22px;font-weight:800;margin:0}.pquote{font-style:italic;margin:6px 0}.pbio{margin:6px 0;overflow-wrap:anywhere}
.pinfo{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pinfo .chip.dim{background:var(--gray);color:var(--muted)}
.style-centrado .avatarwrap{margin:-48px auto 0}.style-centrado .pbody{text-align:center}.style-centrado .pinfo{justify-content:center}
.style-compacto .cover{height:84px}.style-compacto .avatarwrap{margin:-32px 16px 0;width:64px}.style-compacto .pavatar{width:64px;height:64px;font-size:24px}
.lock{display:flex;gap:10px;align-items:center;margin:12px 16px 0;padding:12px;border-radius:14px;background:var(--gray);color:var(--text)}
.hl{padding:0 16px;margin-top:14px}.hl-head{display:flex;justify-content:space-between;align-items:center}
.hl-row{display:flex;gap:12px;overflow-x:auto;padding:8px 0 2px}
.hl-item{flex:none;width:72px;background:transparent;color:var(--text);flex-direction:column;gap:4px;padding:0;font-weight:400;min-height:0}
.hl-circle{width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:22px;overflow:hidden;border:2px solid var(--accent)}
.hl-circle img{width:100%;height:100%;object-fit:cover}.hl-name{font-size:12px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--gray);border-radius:12px;padding:3px;gap:2px}
.seg button{background:transparent;color:var(--text);padding:6px 10px;min-height:36px;font-size:13px;border-radius:9px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.opt{background:var(--gray);color:var(--text);border:2px solid transparent;font-weight:600;padding:8px 14px}
.opt[aria-checked=true]{border-color:var(--accent)}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid var(--line)}.sw[aria-checked=true]{border-color:var(--text)}.sw svg{stroke:var(--on)}
.bgsw{width:56px;height:44px;border-radius:12px;padding:0;background:var(--pbg);border:3px solid var(--line)}.bgsw[aria-checked=true]{border-color:var(--accent)}
.pref{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.pref:last-child{border:0}
.pref select{width:auto;margin:0;max-width:60%}
.switch{position:relative;width:52px;height:32px;flex:none}.switch input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.track{position:absolute;inset:0;border-radius:16px;background:var(--muted);transition:background-color .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--bg);transition:transform .2s var(--ease)}
.switch input:checked+.track{background:var(--accent)}.switch input:checked+.track::after{transform:translateX(20px)}.switch input:focus-visible+.track{outline:3px solid var(--accent);outline-offset:2px}
.photos{display:flex;gap:8px;margin-bottom:12px}.photos button{flex:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--accent);color:var(--on);display:grid;place-items:center;padding:6px;font-size:13px;text-align:center;overflow-wrap:anywhere}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tile.pop{animation:pop .3s var(--ease)}
.tile button{position:absolute;top:4px;right:4px;width:36px;min-height:36px;padding:0;border-radius:50%;background:var(--bg);color:var(--text)}
.coll{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
/* viewer */
.viewer{position:absolute;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.viewer.closing{animation:fadeOut .18s forwards}
.vbars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:2}.vbar{flex:1;height:3px;background:#555;border-radius:2px;overflow:hidden}.vbar i{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left}
.vbar i.done{transform:scaleX(1)}.vbar i.run{animation:bar 4s linear forwards}
.vtop{position:absolute;top:22px;left:12px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2}.vtop .icon-btn{color:#fff}
.vbody{width:100%;max-width:520px;height:calc(100% - 64px);margin-top:64px;display:grid;place-items:center;animation:pop .25s var(--ease)}.vbody img{max-width:100%;max-height:100%;object-fit:contain}
.vbody.text{background:var(--accent);color:var(--on)}.vbody p{font-size:26px;font-weight:700;text-align:center;padding:28px;margin:0;overflow-wrap:anywhere}
.vnav{position:absolute;top:60px;bottom:0;width:40%;background:transparent;min-height:0;border-radius:0;z-index:1}.vnav.prev{left:0}.vnav.next{right:0}
/* keyframes */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes inRight{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inLeft{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
@keyframes popMine{from{opacity:0;transform:translateX(18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes popTheirs{from{opacity:0;transform:translateX(-18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes bounce{0%,60%,100%{transform:translateY(0) scale(.8);opacity:.35}30%{transform:translateY(-4px) scale(1.15);opacity:1}}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}
@keyframes badgePulse{50%{transform:scale(1.45)}}
@keyframes spinIn{from{transform:rotate(-120deg) scale(.5);opacity:.2}to{transform:none;opacity:1}}
@keyframes tabPop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes menuIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes bump{50%{transform:scale(1.12)}}
@keyframes ready{50%{transform:scale(1.1)}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.theme-anim,.theme-anim *,.theme-anim *::before,.theme-anim *::after{transition:background-color .3s,color .3s,border-color .3s,fill .3s,stroke .3s!important}
.no-motion *,.no-motion *::before,.no-motion *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
/* El indicador de "escribiendo" es una señal de estado: sigue vivo aunque se reduzcan las animaciones (solo parpadea, sin moverse) */
.no-motion .typing span{animation-name:blink!important;animation-duration:1.2s!important;animation-iteration-count:infinite!important}
.no-motion .typing span:nth-child(2){animation-delay:.16s!important}.no-motion .typing span:nth-child(3){animation-delay:.32s!important}
.no-motion .dots::after{animation-duration:1.2s!important;animation-iteration-count:infinite!important}

</style>
</head>
<body>
<div class="app">
<header><div><h1>My Family</h1><div class="small muted">Tu espacio privado</div></div><div class="hbtns"><button class="icon-btn hidden" id="bellBtn" aria-label="Notificaciones"><span class="bi"></span><span class="badge" hidden>0</span></button><button class="icon-btn" id="themeBtn" aria-label="Cambiar tema"></button></div></header>
<main id="main"></main>
<nav class="tabs hidden" id="tabs" aria-label="Secciones"></nav>
</div>
<div id="layer"></div><div id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="fileGallery" accept="image/*" hidden>
<input type="file" id="fileCamera" accept="image/*" capture="user" hidden>
<script>
/* ===== 00-core.js ===== */
'use strict';
/* ===== Utilidades, almacenamiento, estado, tema ===== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowTime = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const USER_RE = /^[a-z0-9_]{3,20}$/;
const cleanUser = v => String(v || '').trim().replace(/^@/, '').toLowerCase();
const ACT = {}, CHG = {};   // acciones por data-act / data-chg

const S = p => '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
const IC = {
  chat: S('<path d="M4 5h16v11H9l-5 4z"/>'),
  users: S('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c3 0 4.5 1.8 4.5 4.5"/>'),
  grid: S('<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'),
  user: S('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/>'),
  sun: S('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),

  const s = openSheet(`<h3>Nueva colección</h3><label for="ncName">Nombre</label><input id="ncName" maxlength="24" placeholder="Ej. Vacaciones" autocomplete="off"><div class="row"><button class="secondary grow" id="ncNo">Cancelar</button><button class="grow" id="ncOk">Crear</button></div>`), inp = $('#ncName', s.sh); inp.focus();
  const ok = () => {
    const n = inp.value.trim(); if (!n) return bad('#ncName', 'Escribe un nombre.');
    const h = { id: uid(), name: n, cover: null, items: [] }; if (!commitUser(() => user.highlights.push(h), 'Colección creada')) return;
    s.close(); ps.col = h.id; ps.sub = 'col'; page = 'profile'; render('right');
  };
  $('#ncOk', s.sh).onclick = ok; $('#ncNo', s.sh).onclick = () => s.close(); inp.onkeydown = e => { if (e.key === 'Enter') ok() };
};
ACT.saveColName = () => { const n = $('#colName').value.trim(); if (!n) return bad('#colName', 'Escribe un nombre.'); const h = curCol(); if (commitUser(() => h.name = n, 'Nombre guardado')) render() };
ACT.colCover = async () => { const h = curCol(), r = await pickImage({ title: 'Portada de la colección', outW: 320, outH: 320, canRemove: !!h.cover }); if (r === null) return; if (commitUser(() => h.cover = r || null, r ? 'Portada actualizada' : 'Portada quitada')) render() };
function addItem(it) {
  const h = curCol(); if (!commitUser(() => h.items.push(it), 'Historia publicada en la colección')) return;
  render(); const t = $(`[data-item="${it.id}"]`); if (t) { t.classList.add('pop'); t.scrollIntoView({ block: 'nearest' }) }
}
ACT.addPhoto = async () => { const r = await pickImage({ title: 'Agregar foto', outW: 540, outH: 960, allowFit: true }); if (r) addItem({ id: uid(), type: 'img', img: r, date: Date.now() }) };
ACT.addText = () => {
  const s = openSheet(`<h3>Agregar texto</h3><label for="atText">Mensaje</label><textarea id="atText" maxlength="140" rows="4" placeholder="Escribe algo para tu familia..."></textarea><div class="row"><button class="secondary grow" id="atNo">Cancelar</button><button class="grow" id="atOk">Publicar</button></div>`);
  $('#atText', s.sh).focus(); $('#atNo', s.sh).onclick = () => s.close();
  $('#atOk', s.sh).onclick = () => { const t = $('#atText', s.sh).value.trim(); if (!t) return bad('#atText', 'Escribe un mensaje.'); s.close(); addItem({ id: uid(), type: 'text', text: t, date: Date.now() }) };
};
ACT.delItem = async b => { if (!await confirmBox('¿Eliminar esta historia?', 'Se quitará de la colección.', 'Eliminar', true)) return; const h = curCol(); if (commitUser(() => h.items = h.items.filter(i => i.id !== b.dataset.item), 'Historia eliminada')) render() };
ACT.delCol = async () => { const h = curCol(); if (!await confirmBox('¿Eliminar "' + h.name + '"?', 'Se borrarán todas sus historias.', 'Eliminar', true)) return; if (commitUser(() => user.highlights = user.highlights.filter(x => x.id !== h.id), 'Colección eliminada')) { ps.sub = 'hl'; render('left') } };
/* ----- Visor de historias destacadas ----- */
function openViewer(h) {
  const items = h.items; if (!items.length) return toast('Esta colección está vacía.');
  let i = 0, timer; const ov = el('div', 'viewer'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Historias destacadas: ' + h.name); $('#layer').append(ov);
  const close = () => { clearTimeout(timer); ov.classList.add('closing'); setTimeout(() => ov.remove(), reduce() ? 0 : 190) }; ov.close = close;
  const next = () => { if (i < items.length - 1) { i++; show() } else close() }, prev = () => { if (i > 0) i--; show() };
  function show() {
    clearTimeout(timer); const it = items[i];
    ov.innerHTML = `<div class="vbars">${items.map((_, k) => `<span class="vbar"><i class="${k < i ? 'done' : k === i ? 'run' : ''}"></i></span>`).join('')}</div><div class="vtop"><b>${esc(h.name)}</b><button class="icon-btn" data-v="x" aria-label="Cerrar">${IC.close}</button></div><div class="vbody ${it.type}">${it.type === 'img' ? `<img src="${it.img}" alt="Historia ${i + 1} de ${items.length}">` : `<p>${esc(it.text)}</p>`}</div><button class="vnav prev" data-v="p" aria-label="Anterior"></button><button class="vnav next" data-v="n" aria-label="Siguiente"></button>`;
    timer = setTimeout(next, 4000);
  }
  ov.onclick = e => { const b = e.target.closest('[data-v]'); if (b) ({ x: close, p: prev, n: next })[b.dataset.v]() };
  show();
}

/* ===== 40-main.js ===== */
/* ===== Navegación principal e inicio ===== */
const TABS = [['chats', 'Chats', 'chat'], ['contacts', 'Contactos', 'users'], ['groups', 'Grupos', 'grid'], ['profile', 'Perfil', 'user']];
function go(p) { if (p === page && !activeChat && (p !== 'profile' || ps.sub === 'view')) return; page = p; activeChat = null; if (p === 'profile') ps.sub = 'view'; render('fade') }
function render(dir) {
  const m = $('#main'), tabs = $('#tabs'), keep = dir ? 0 : m.scrollTop;
  $$('.menu-ov').forEach(x => x.remove()); m.classList.remove('chatmode');
  $('#bellBtn').classList.toggle('hidden', !user);
  if (!user) { tabs.classList.add('hidden'); viewWelcome(m) } else {
    tabs.classList.remove('hidden'); $$('button', tabs).forEach(b => { const on = b.dataset.page === page; b.classList.toggle('active', on); b.setAttribute('aria-current', on ? 'page' : 'false') });
    if (page === 'chats') activeChat ? viewChat(m) : viewChats(m); else if (page === 'contacts') viewContacts(m); else if (page === 'groups') viewGroups(m); else viewProfile(m);
  }
  if (dir) { m.dataset.dir = dir; m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); m.scrollTop = 0 } else m.scrollTop = keep;
}
/* Ajusta la app al área realmente visible (cuando sale el teclado, Chrome deja fuera el encabezado) */
let maxH = 0, lastW = 0;
function fitViewport() {
  const vv = window.visualViewport, r = document.documentElement, h = vv ? vv.height : innerHeight;
  if (innerWidth !== lastW) { lastW = innerWidth; maxH = 0 } maxH = Math.max(maxH, h, innerHeight);
  r.style.setProperty('--vh', h + 'px'); r.style.setProperty('--vt', (vv ? vv.offsetTop : 0) + 'px');
  const kb = maxH - h > 150, was = r.classList.contains('kb'); r.classList.toggle('kb', kb);
  if (kb !== was) requestAnimationFrame(() => { const a = $('#chatArea'); if (a) a.scrollTop = a.scrollHeight });
}
/* ----- Instalar como app ----- */
let deferredPrompt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (user && page === 'profile' && ps.sub === 'view') render() });
addEventListener('appinstalled', () => { deferredPrompt = null; toast('¡App instalada! Búscala en tu pantalla de inicio.', 'ok'); if (user && page === 'profile' && ps.sub === 'view') render() });
function init() {
  fitViewport(); addEventListener('resize', fitViewport); if (window.visualViewport) { visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport) }
  loadAll(); applyLook(false); $('#bellBtn .bi').innerHTML = IC.bell; updateBell(false);
  $('#tabs').innerHTML = TABS.map(([k, l, i]) => `<button data-page="${k}">${IC[i]}<span>${l}</span></button>`).join('');
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-page]'); if (b) go(b.dataset.page) });
  $('#themeBtn').onclick = toggleTheme; $('#bellBtn').onclick = openBell;
  const m = $('#main');
  m.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e) });
  m.addEventListener('input', e => { if (e.target.id === 'msg') onType(e.target) });
  m.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t, e) });
  m.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter && ACT[e.target.dataset.enter]) { e.preventDefault(); ACT[e.target.dataset.enter](e.target, e) } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { const t = $$('#layer > *').pop(); if (t && t.close) t.close(); else if (t) t.remove() } });
  render('fade');
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();
